{{define "index.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Groupie Tracker - Explore bands and artists, their concert locations and dates.">
    <title>Groupie Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="logo">
                <span class="logo-icon">🎵</span>
                <span class="logo-text">Groupie Tracker</span>
            </a>
        </div>
    </header>

    <main class="container">
        <!-- Search Block (Block visualization) -->
        <section class="search-block" id="search-block">
            <h2 class="search-title">Discover Artists & Bands</h2>
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by artist name..."
                    autocomplete="off"
                    aria-label="Search artists"
                >
            </div>
        </section>

        <!-- Artists Cards Grid (Card visualization) -->
        <section class="artists-section">
            <div id="artists-grid" class="cards-grid">
                {{range .}}
                <a href="/artist?id={{.ID}}" class="card" id="artist-card-{{.ID}}">
                    <div class="card-image">
                        <img src="{{.Image}}" alt="{{.Name}}" loading="lazy" width="300" height="300">
                    </div>
                    <div class="card-info">
                        <h3 class="card-name">{{.Name}}</h3>
                        <p class="card-year">Since {{.CreationDate}}</p>
                    </div>
                </a>
                {{end}}
            </div>
            <div id="no-results" class="no-results" style="display:none;">
                <p>🔍 No artists found matching your search.</p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2024 Groupie Tracker. Data from Groupie Trackers API.</p>
        </div>
    </footer>

    <script src="/static/js/script.js"></script>
</body>
</html>
{{end}}
